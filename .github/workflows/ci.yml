name: 基金 V2 测试

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装项目
        run: python -m pip install -e .
      - name: 运行基金单元测试
        run: python -m unittest discover -s tests/funds -v
      - name: 编译检查
        run: python -m compileall -q tradingagents/funds tradingagents/deepseek.py tests/funds
      - name: OpenClaw 脚本语法检查
        run: bash -n integrations/openclaw/china-fund-advisor/scripts/run_fund_advisor.sh
